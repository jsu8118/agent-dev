# Convenience services for the course. Examples:
#   docker compose build
#   docker compose run --rm tests                 # full test suite, mock mode
#   docker compose run --rm course bash           # a shell with everything installed (repo mounted at /course)
#   docker compose up mock-api                    # the offline mock Claude API on http://localhost:8765
#   docker compose up copilot                     # the Day 7 capstone service on http://localhost:8080
#                                                 #   (set COPILOT_API_KEY in .env to require an X-Api-Key header)
services:
  course:
    build: .
    image: claude-agent-course
    working_dir: /course
    volumes:
      - ./:/course
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    command: bash

  tests:
    image: claude-agent-course
    build: .
    environment:
      LABKIT_MODE: mock
    command: python -m pytest -q

  mock-api:
    image: claude-agent-course
    build: .
    command: python -m labkit.mock.server --host 0.0.0.0 --port 8765
    ports:
      - "127.0.0.1:8765:8765"          # published on the host's loopback only

  copilot:
    image: claude-agent-course
    build: .
    env_file:
      - path: .env
        required: false
    command: uvicorn --app-dir day7_capstone/reference copilot.service:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
